<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F5A623" />
  <script>
    // Apply the saved (or system) theme before first paint to avoid a flash.
    (function () {
      try {
        var stored = localStorage.getItem("recess-theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="Recess — link-based async games. Create a game, drop the link in any chat, and play when it's your turn. No login. Silence is safe here." />

  <!-- Open Graph — renders as a rich preview when the game link is pasted
       into WhatsApp / Telegram / Facebook. Keep og:image pointing at an
       absolute URL in production so every crawler fetches it. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Recess" />
  <meta property="og:title" content="Recess — Tic Tac Toe" />
  <meta property="og:description" content="You've been challenged to a game of Recess. Tap to play — silence is safe here." />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <title>Reces</title>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
