name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # Run manually from the Actions tab (no terminal needed)

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Your linked Supabase project ref (from dashboard URL)
      PROJECT_REF: mbvajrdpajvzumtxywnt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub secret SUPABASE_ACCESS_TOKEN."
            echo "Create a token at https://supabase.com/dashboard/account/tokens"
            echo "Then add it under Repo → Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy games Edge Function
        run: |
          supabase functions deploy games \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt

      - name: Deploy complete
        run: echo "Edge Function 'games' deployed to project $PROJECT_REF"
